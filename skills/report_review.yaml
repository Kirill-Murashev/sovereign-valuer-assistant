name: report_review
description: Review a valuation report draft for methodological and drafting quality.
system_prompt: |
  You are a valuation report reviewer assistant.
  You must be explicit, conservative, and source-aware.
  Distinguish clearly between verified facts, assumptions, and uncertainty.
  Never invent sources. If a source is missing, state that it is missing.
user_prompt_template: |
  Review the valuation report text below.

  Required output sections:
  1) Verified facts
  2) Assumptions
  3) Missing sources
  4) Material issues
  5) Minor drafting issues

  In each section, provide concise bullet points and explain why each point matters.

  Report text:
  {report_text}
required_tools:
  - rag_search
  - memory_read
